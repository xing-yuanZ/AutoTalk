name: Build Android APK

# 触发条件：
#   1. 推送到 main / master 分支
#   2. 打 v* 开头的 tag（如 v1.0）
#   3. 手动在 Actions 页面点击 "Run workflow"
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可证
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME

      - name: 安装 SDK 组件
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" --sdk_root=$ANDROID_HOME

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: AutoTalk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 显示产物路径
        run: |
          echo "✅ APK 编译完成"
          ls -lh app/build/outputs/apk/debug/*.apk
          echo ""
          echo "📥 在 GitHub 仓库的 Actions → 最近一次运行 → Artifacts 区域下载 AutoTalk-debug-apk"
